name: Weekly email

on:
  schedule:
    - cron: '0 17 * * 4'  # Thursdays 17:00 UTC = 19:00 CEST (summer) / 18:00 CET (winter)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send email only to matt_palmer@outlook.com'
        required: false
        default: 'true'
        type: boolean

jobs:
  send-email:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests premailer beautifulsoup4 lxml

      - name: Send weekly email
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON:        ${{ secrets.SUPABASE_ANON }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_PORT:            ${{ secrets.SMTP_PORT }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:        ${{ secrets.SMTP_PASSWORD }}
          FROM_ADDRESS:         ${{ secrets.FROM_ADDRESS }}
          FROM_NAME:            ${{ secrets.FROM_NAME }}
          TEST_RECIPIENT:       ${{ inputs.test_mode == true && 'matt_palmer@outlook.com' || '' }}
        run: python pipeline.py --email-only