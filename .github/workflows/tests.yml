name: Tests

# Runs the offline test suite (VOSE accuracy rules) whenever code changes.
# The daily listings commits only touch docs/, so they don't trigger it.
on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "tests/**"
      - "vose_reviewed.json"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
